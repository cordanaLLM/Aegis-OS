# Project preparation gate layered over Praetor's generated governance hooks.
# compile-context --verify and audit are supplied by the generated context-check
# and hiss-audit jobs; this job runs the repository's Python checks only. The
# rest of the gate is what `make verify-all` runs.
pre-commit:
  commands:
    preparation:
      run: python3 -B -m unittest discover -s tools -p 'test_*.py' && python3 tools/verify_preparation.py
