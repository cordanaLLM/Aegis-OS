---
name: "Component Activation Request"
description: >-
  Propose promoting one component from proposal to activated against recorded evidence
title: "[ACTIVATE]: P"
labels: ["component-activation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Activation requires an `activation_evidence` block the gate accepts
        (see `GOVERNANCE.md` and `tools/verify_preparation.py`): a component
        directory named after the component, a git-tracked manifest inside it
        whose `[package] name` matches, a git-tracked dependency lock, a test
        command naming the component, and the milestone in
        `planning/roadmap.json` this request closes. The component's remaining
        activation blockers stay recorded. Read `planning/components.json` for
        the recorded precedent before filing.
  - type: input
    id: component
    attributes:
      label: "Component ID and name"
      placeholder: "P07 aegis-lictor"
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: "Roadmap milestone"
      placeholder: "Mnn"
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: "Component manifest and dependency lock"
      description: "Paths and how the toolchain is admitted through the template matrix."
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: "Interface contract"
      description: >-
        Schemas, transports, correlation IDs, and owning repositories for every cross-component
        edge.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: "Positive, negative, and boundary tests"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence limits"
      description: >-
        State what the tests do NOT prove (no build, boot, hardware, or release claims).
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: "Remaining activation blockers"
      description: >-
        The blockers that stay open after activation; the gate requires this list to remain
        non-empty.
    validations:
      required: true
