---
# Verification gate: the status check .github/rulesets/main.json requires on
# pull requests. It runs `make verify-all`, so it carries whatever gates that
# target carries, plus the licence, lint and sign-off steps listed below. It
# builds no product image, boots nothing and publishes no release: the image,
# boot, hardware, accessibility and release gates stay blocked. The M04
# accessibility harness it runs covers the P12 token component only, and the M09
# contract pair gate covers imago's consumption of the two Aegis payloads and
# nucleus's declared-level verification of the kernel requirement only.
name: Verification gate

on:
  pull_request:
    # edited: the public host scan below reads the pull request title and
    # body, which change without a push.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  # The engine audit inside `make verify-all` reads main's workflow runs.
  actions: read

concurrency:
  group: preparation-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK_VERSION: "2.1.12"
  LEFTHOOK_SHA256: "22ff1ad48d1a0f4dca8d6b7e920056c6a9015f9204e5b693858ed9c2db759a16"
  REUSE_VERSION: "6.2.0"
  MARKDOWNLINT_VERSION: "0.23.2"
  YAMLLINT_VERSION: "1.38.0"
  FLAKE8_VERSION: "7.3.0"
  BLACK_VERSION: "26.5.1"
  # shfmt-py on PyPI ships the shfmt release binary; 4.2.0 carries shfmt 3.14.1.
  SHFMT_VERSION: "4.2.0"
  # Security scanners .standards.yaml declares, each a release binary checked
  # against the sha256 its release publishes, or a PyPI pin. Trivy is the
  # binary, not aquasecurity/trivy-action: the action's tags were rewritten in
  # the March 2026 compromise (CVE-2026-33634), and a binary pinned by digest
  # cannot move under a tag.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
  SEMGREP_VERSION: "1.180.0"
  # Published Praetor commit that builds the praetorctl this gate pins. The
  # name is the one Praetor's hook launcher looks for under .github/workflows,
  # so local hooks and this job resolve the same engine; a full commit SHA.
  PRAETOR_REF: "32a35c8fb947b449ff46ae0a3b32017b409dccad"
  # D80 libva floor on this runner (maintainer decision of 2026-09-29): the
  # intel/libva release tarball, its sha256 as the GitHub release publishes it,
  # and the meson and ninja wheels that build it, each pinned by its PyPI sha256.
  LIBVA_VERSION: "2.24.1"
  LIBVA_SHA256: "eec6050b52876f229bd35e9df17cd31a06785e18e6f7990c445b584628483d67"
  MESON_VERSION: "1.12.1"
  MESON_WHEEL_SHA256: "930bc7542cbd9f57009e182fd014eba48cf1a0180a7b9006d2d32d8f168d8b02"
  NINJA_VERSION: "1.13.2"
  NINJA_WHEEL_SHA256: "65a24341b5ac09fcadcc37082660be40a94174e51a937fabf6e2cae26225fa2c"

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-26.04
    # The job took at most 397 s over its 40 latest successful runs on
    # 2026-10-13, the accessibility gate's 912 MiB image fetch (about 70 s)
    # included; tools/verify_preparation.py holds every job to 15 minutes.
    timeout-minutes: 15
    steps:
      # HISS-18: a draft stops here, before any work, and fails, so a
      # required check never reports a skipped draft as a pass. Marking the
      # pull request ready for review starts the run that replaces it.
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The public tree and the pull request text name a hardware class, never
      # the reference workstation. make verify-all scans the tracked files; this
      # step scans the title and body, which no checkout contains. The text
      # reaches the script through the environment and a file, never through an
      # expression inside the command, so no title or body is read as shell.
      - name: Scan the pull request text for host identifiers
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request.md"
          python3 tools/verify_public_host.py --text-file "$RUNNER_TEMP/pull-request.md"

      - name: Release pull requests stay blocked until roadmap milestone M13 is done
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: |
          state="$(python3 tools/roadmap_state.py M13)"
          if [ "$state" != "done" ]; then
            echo "::error::release pull request blocked: roadmap milestone M13" \
              "(release signing and remote delivery) is \"$state\", expected \"done\"."
            exit 1
          fi
          printf '%s\n' 'roadmap M13 is done; release pull requests may proceed.'

      - name: Check out pinned Praetor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cordanaLLM/praetor
          ref: ${{ env.PRAETOR_REF }}
          path: praetor-src
          persist-credentials: false

      - name: Set up the Go toolchain declared by Praetor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: praetor-src/go.mod
          cache: false

      - name: Build pinned praetorctl from the published Praetor commit
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: |
          test "$(git -C praetor-src rev-parse HEAD)" = "$PRAETOR_REF"
          mkdir -p "$RUNNER_TEMP/bin"
          ( cd praetor-src && go mod download && go mod verify \
            && go vet ./... \
            && go build -trimpath -buildvcs=false \
              -o "$RUNNER_TEMP/bin/praetorctl" ./cmd/standardsctl )
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # The Praetor checkout is a build input only; the preparation gate must
          # not scan or publish it as Aegis repository content.
          rm -rf praetor-src

      - name: Install pinned lefthook
        run: |
          url="https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/bin/lefthook" "$url"
          echo "${LEFTHOOK_SHA256}  $RUNNER_TEMP/bin/lefthook" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/lefthook"
          lefthook install

      # The runner image ships rustup and a Rust toolchain, but neither is the
      # pin: the image's toolchain is not named 1.99.1 and carries no clippy, so
      # a cargo gate run without this step would test whatever the image happens
      # to ship. `rustup toolchain install` with no toolchain argument installs
      # the active toolchain, which rust-toolchain.toml overrides to the pinned
      # channel, and -c materialises the components that same file names.
      - name: Materialise the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update --profile minimal \
            -c rustfmt,clippy
          rustup show active-toolchain
          rustup which rustc
          rustup which cargo-clippy

      # The P17 crate's VA-API binding (cros-libva, D80) generates its bindings
      # from the libva headers at build time and links libva and libva-drm. This
      # runner's apt archive carries libva 2.20.0, below the admitted floor of
      # 2.24.1 (VA-API 1.24.0), so, as the maintainer decided on 2026-09-29, the
      # job builds the pinned release tarball with meson and ninja and caches
      # the installed prefix; a change to any pin below is a new cache key.
      # libva's meson.build requires libdrm 2.4.75 or later for libva-drm, and
      # the image ships no libdrm headers, so they come from the runner's own
      # signed Ubuntu archive, unpinned and read back against that floor
      # (docs/roadmap/toolchain-admission.md records both).
      - name: Install the libdrm headers libva-drm builds against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdrm-dev
          pkg-config --modversion libdrm
          pkg-config --atleast-version=2.4.75 libdrm

      # The P05 shell's toolkit (gpui, D102) links libxkbcommon through the
      # xkbcommon crate, and FreeType and Fontconfig through its font stack
      # (freetype-sys and yeslogic-fontconfig-sys find them with pkg-config).
      # The image ships none of their headers, so they come from the runner's
      # signed Ubuntu archive, unpinned, and each version is printed; their
      # floors are M28's admission (docs/roadmap/toolchain-admission.md).
      - name: Install the C libraries gpui links
        run: |
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libfontconfig-dev libfreetype-dev
          pkg-config --modversion xkbcommon fontconfig freetype2

      # The cache key names the runner image (ImageOS, e.g. ubuntu26), so a
      # prefix built on one image is never restored on another.
      - name: Name the runner image for the libva cache key
        id: runner-image
        run: |
          test -n "${ImageOS:-}" || { echo "::error::ImageOS is not set"; exit 1; }
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned libva build
        id: libva-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aegis-libva/${{ env.LIBVA_VERSION }}
          key: "libva-${{ env.LIBVA_VERSION }}-${{ env.LIBVA_SHA256 }}\
            -meson-${{ env.MESON_VERSION }}-ninja-${{ env.NINJA_VERSION }}-werror\
            -${{ steps.runner-image.outputs.image }}"

      - name: Build the pinned libva from its release tarball
        if: steps.libva-cache.outputs.cache-hit != 'true'
        run: |
          prefix="$HOME/.cache/aegis-libva/$LIBVA_VERSION"
          work="$RUNNER_TEMP/libva-build"
          mkdir -p "$work"
          url="https://github.com/intel/libva/releases/download/${LIBVA_VERSION}/libva-${LIBVA_VERSION}.tar.bz2"
          curl -fsSL --max-time 120 -o "$work/libva.tar.bz2" "$url"
          echo "${LIBVA_SHA256}  $work/libva.tar.bz2" | sha256sum -c -
          tar -xjf "$work/libva.tar.bz2" -C "$work"
          python3 -m venv "$work/venv"
          {
            echo "meson==${MESON_VERSION} --hash=sha256:${MESON_WHEEL_SHA256}"
            echo "ninja==${NINJA_VERSION} --hash=sha256:${NINJA_WHEEL_SHA256}"
          } > "$work/requirements.txt"
          "$work/venv/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            --no-deps -r "$work/requirements.txt"
          export PATH="$work/venv/bin:$PATH"
          meson --version
          ninja --version
          meson setup --werror "$work/build" "$work/libva-${LIBVA_VERSION}" \
            --prefix="$prefix" --libdir=lib --buildtype=release \
            -Dwith_x11=no -Dwith_glx=no -Dwith_wayland=no -Dwith_win32=no \
            -Denable_docs=false
          meson compile -C "$work/build"
          meson install -C "$work/build"

      # PKG_CONFIG_PATH is how cros-libva's build script finds the headers, and
      # LD_LIBRARY_PATH is how the test binaries find libva at run time: Cargo
      # adds a build script's search path to the loader path only inside the
      # target directory. make verify-rust reads the version back again before
      # it builds (tools/display_toolchain.py).
      - name: Point the crate build at the pinned libva
        run: |
          prefix="$HOME/.cache/aegis-libva/$LIBVA_VERSION"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          test "$(PKG_CONFIG_PATH="$prefix/lib/pkgconfig" \
            pkg-config --variable=libva_version libva)" = "$LIBVA_VERSION"
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig" pkg-config --modversion libva

      # The accessibility gate inside make verify-all never pulls and never
      # downloads (M04). This is the one networked step: it pulls the
      # Playwright image by digest, downloads the pinned Node tarball and pnpm
      # binary, refuses either unless it hashes to its pin, and fills the
      # offline pnpm store, so the gate runs here instead of printing SKIP.
      # The runner has podman and docker; the gate prefers podman.
      - name: Fetch the accessibility gate's pinned inputs
        run: make a11y-fetch

      # The contract pair gate inside make verify-all never touches the network
      # either (M09, D93). This is its one networked step: git ls-remote against
      # both producers, a depth-1 fetch of cordanaLLM/imago and cordanaLLM/nucleus
      # at the commits build/contract/producers.pin.json names (nucleus since
      # D106, for the verifier the gate runs with this runner's python3), and a
      # GOTOOLCHAIN=local build of imago with -buildvcs=true, refused unless the
      # binary carries that revision. The
      # Go set up above for praetorctl builds it: Praetor's go.mod declares go
      # 1.27, which setup-go resolves to the newest 1.27 patch (1.27.1 when this
      # was written), at or above the go 1.27.1 imago's go.mod requires.
      - name: Fetch the contract pair's pinned producer
        run: make contract-fetch

      # The systemd and mkosi definition gates need systemd 261 and mkosi 27; the
      # runner ships systemd 255 and no mkosi. This is their one networked step:
      # it pulls the Arch Linux base image by the digest
      # build/definitions/toolchain.pin.json names, installs the pinned packages
      # from one Arch Linux Archive snapshot, and removes the image again unless
      # pacman reports every package at its pinned version. The gates then run
      # inside it without a network, with the repository mounted read-only.
      # The archive server is one host (#290): the image the last green fetch
      # built is kept in an Actions cache keyed by the pin's hash, and the fetch
      # loads it, and checks it like a built one, only after every attempt
      # against the server failed. A green fetch with no cached copy saves one.
      # A pull request's cache is scoped to its merge ref, so the run on main
      # after a pin change cannot restore it (run 39029749159): a pull request
      # whose cache missed also uploads the image as an artifact named after
      # the key, and a run whose cache missed takes the newest such artifact
      # from this repository first (tools/definitions_handoff.py).
      - name: Restore the definition gates' saved image
        id: definitions-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/definitions-cache/main
          key: "definitions-${{ hashFiles('build/definitions/toolchain.pin.json') }}"

      - name: Take the definition gates' image a merged pull request built
        if: steps.definitions-cache.outputs.cache-hit != 'true'
        env:
          AEGIS_DEFINITIONS_CACHE: ${{ runner.temp }}/definitions-cache/main
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/definitions_handoff.py
          --name "definitions-${{ hashFiles('build/definitions/toolchain.pin.json') }}"

      - name: Fetch the definition gates' pinned image
        env:
          AEGIS_DEFINITIONS_CACHE: ${{ runner.temp }}/definitions-cache/main
        run: make definitions-fetch

      - name: Save the definition gates' image for later runs
        if: steps.definitions-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/definitions-cache/main
          key: "definitions-${{ hashFiles('build/definitions/toolchain.pin.json') }}"

      - name: Hand the definition gates' image to the run after the merge
        if: >-
          steps.definitions-cache.outputs.cache-hit != 'true'
          && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "definitions-${{ hashFiles('build/definitions/toolchain.pin.json') }}"
          path: ${{ runner.temp }}/definitions-cache/main
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      # make verify-all runs the crate gate itself once a workspace manifest is
      # present, so the cargo evidence sits inside this one job. That is
      # deliberate: the branch ruleset requires exactly the "Verification gate"
      # check, and a separate job would not be required and could be skipped.
      # AEGIS_REQUIRED_GATES names the definition gates this check requires: a
      # gate listed here that cannot run prints FAIL instead of SKIP, so the
      # required check cannot pass on a gate that never ran (tools/gate_policy.py).
      # AEGIS_DEFINITIONS_CONTAINER=1 runs both inside the image fetched above;
      # without that image they fail, never falling back to the runner's tools.
      - name: Verification gate
        env:
          AEGIS_DEFINITIONS_CONTAINER: "1"
          # The engine audit reads the forge with this token; without one it
          # skips the workflow-run and live branch protection checks.
          GITHUB_TOKEN: ${{ github.token }}
          AEGIS_REQUIRED_GATES: systemd,mkosi
        run: make verify-all

      # The systemd gate admits every release from SYSTEMD_FLOOR up; the image
      # above holds a newer one. This reruns it on the floor release itself,
      # inside the image build/definitions/toolchain-floor.pin.json pins, so the
      # floor is a version a run covers (C13-2). Required, so it fails, never
      # skips, when the image is missing or the tools fall below the floor. Its
      # saved copy is kept the way the main image's is, under its own pin's hash.
      - name: Restore the systemd floor image
        id: definitions-floor-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/definitions-cache/floor
          key: "definitions-floor-${{ hashFiles('build/definitions/toolchain-floor.pin.json') }}"

      - name: Take the systemd floor image a merged pull request built
        if: steps.definitions-floor-cache.outputs.cache-hit != 'true'
        env:
          AEGIS_DEFINITIONS_CACHE: ${{ runner.temp }}/definitions-cache/floor
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/definitions_handoff.py --floor
          --name "definitions-floor-${{ hashFiles('build/definitions/toolchain-floor.pin.json') }}"

      - name: Fetch the systemd floor image
        env:
          AEGIS_DEFINITIONS_CACHE: ${{ runner.temp }}/definitions-cache/floor
        run: make definitions-fetch-floor

      - name: Save the systemd floor image for later runs
        if: steps.definitions-floor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/definitions-cache/floor
          key: "definitions-floor-${{ hashFiles('build/definitions/toolchain-floor.pin.json') }}"

      - name: Hand the systemd floor image to the run after the merge
        if: >-
          steps.definitions-floor-cache.outputs.cache-hit != 'true'
          && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "definitions-floor-${{ hashFiles('build/definitions/toolchain-floor.pin.json') }}"
          path: ${{ runner.temp }}/definitions-cache/floor
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Systemd definition gate at the floor
        env:
          AEGIS_DEFINITIONS_CONTAINER: floor
          AEGIS_REQUIRED_GATES: systemd
        run: make verify-systemd

      # reuse, markdownlint-cli2, yamllint, flake8, black and shellcheck run
      # inside `make verify-all` (its prerequisite verify-lints), whose recipes
      # take their versions from the env block above; no step runs them twice.

      # The security scans run as steps of this job, not as jobs of their own:
      # the ruleset requires this job's status, and a separate job could be
      # skipped without blocking a merge. Each scan first runs on the planted
      # defects in tools/scan-plants/ and fails unless the scanner refuses
      # them, so a scanner that stopped detecting cannot pass here silently.
      - name: Install pinned gitleaks and trivy
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download"
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "$base/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          base="https://github.com/aquasecurity/trivy/releases/download"
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/trivy.tar.gz" \
            "$base/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy

      # Every commit of the history, not only the tip: a secret removed by a
      # later commit is still published. .gitleaksignore holds the reviewed
      # false positives by fingerprint. The planted token is built at run time
      # because a committed one would itself be a finding.
      - name: Secret scan
        run: |
          plant="$RUNNER_TEMP/gitleaks-plant"
          git init -q "$plant"
          token="ghp_$(head -c 512 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'token = "%s"\n' "$token" > "$plant/config.env"
          git -C "$plant" add config.env
          git -C "$plant" -c user.name=plant -c user.email=plant@invalid \
            commit -q -m plant
          rc=0
          gitleaks git --no-banner --redact --exit-code 5 "$plant" || rc=$?
          if [ "$rc" -ne 5 ]; then
            echo "::error::gitleaks did not refuse the planted token (exit $rc)"
            exit 1
          fi
          gitleaks git --no-banner --redact --exit-code 1 .

      # Local rules only (.config/semgrep/hiss.yml) and --metrics=off, so the
      # result moves only when this repository changes it. The control requires
      # every rule id in the file to fire on the plants.
      - name: Semgrep
        run: |
          plant="$RUNNER_TEMP/semgrep-plant"
          mkdir -p "$plant/.github/workflows"
          for f in dynamic.py dynamic.js banned.c; do
            cp "tools/scan-plants/$f.plant" "$plant/$f"
          done
          cp tools/scan-plants/workflow.yml.plant "$plant/.github/workflows/planted.yml"
          rules="$PWD/.config/semgrep/hiss.yml"
          rc=0
          (cd "$plant" && pipx run "semgrep==${SEMGREP_VERSION}" scan --metrics=off \
            --disable-version-check --error --json --output "$RUNNER_TEMP/semgrep-plant.json" \
            --config "$rules" .) || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::semgrep did not refuse the plants (exit $rc)"
            exit 1
          fi
          want=$(grep -E '^  - id: ' "$rules" | sed 's/.*id: //' | sort -u)
          got=$(jq -r '.results[].check_id | split(".") | last' \
            "$RUNNER_TEMP/semgrep-plant.json" | sort -u)
          if [ "$want" != "$got" ]; then
            echo "::error::semgrep rules that matched no plant:"
            comm -23 <(echo "$want") <(echo "$got")
            exit 1
          fi
          pipx run "semgrep==${SEMGREP_VERSION}" scan --metrics=off \
            --disable-version-check --error --config "$rules" .

      # --include-dev-deps: without it trivy reads no package of a lockfile that
      # holds development dependencies only, ui/concordia-tokens/pnpm-lock.yaml
      # among them, and passes it unscanned. The coverage check fails when a
      # lockfile drops out of the scan.
      - name: Trivy
        run: |
          plant="$RUNNER_TEMP/trivy-plant"
          mkdir -p "$plant"
          cp tools/scan-plants/requirements.txt.plant "$plant/requirements.txt"
          rc=0
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 5 --no-progress --disable-telemetry --skip-version-check \
            "$plant" || rc=$?
          if [ "$rc" -ne 5 ]; then
            echo "::error::trivy did not refuse the planted Django release (exit $rc)"
            exit 1
          fi
          rc=0
          trivy fs --scanners vuln,secret,misconfig --include-dev-deps \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            --disable-telemetry --skip-version-check --format json \
            --output "$RUNNER_TEMP/trivy.json" . || rc=$?
          trivy convert --format table "$RUNNER_TEMP/trivy.json"
          for lock in Cargo.lock docs/requirements.txt \
            tools/markdownlint/package-lock.json ui/concordia-tokens/pnpm-lock.yaml; do
            if ! jq -e --arg t "$lock" 'any(.Results[]?; .Target == $t)' \
              "$RUNNER_TEMP/trivy.json" > /dev/null; then
              echo "::error::trivy did not scan $lock"
              rc=1
            fi
          done
          exit "$rc"

      - name: DCO sign-off on pull request commits
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha lacks a Signed-off-by trailer"
              missing=1
            fi
          done
          exit "$missing"
