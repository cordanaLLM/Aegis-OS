---
# Verification gate: the status check .github/rulesets/main.json requires on
# pull requests. It runs `make verify-all`, so it carries whatever gates that
# target carries, plus the licence, lint and sign-off steps listed below. It
# builds no product image, boots nothing and publishes no release: the image,
# boot, hardware, accessibility and release gates stay blocked. The M04
# accessibility harness it runs covers the P12 token component only, and the M09
# contract pair gate covers imago's consumption of the two Aegis payloads only.
name: Verification gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preparation-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK_VERSION: "2.1.12"
  LEFTHOOK_SHA256: "22ff1ad48d1a0f4dca8d6b7e920056c6a9015f9204e5b693858ed9c2db759a16"
  REUSE_VERSION: "6.2.0"
  MARKDOWNLINT_VERSION: "0.23.2"
  YAMLLINT_VERSION: "1.38.0"
  FLAKE8_VERSION: "7.3.0"
  BLACK_VERSION: "26.5.1"
  # Published Praetor commit that builds the praetorctl this gate pins.
  PRAETOR_COMMIT: "54aeec63d5fcb33bdb1f684967be08a82ca6f3c1"

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-24.04
    # 30 rather than 20 since M04: the accessibility gate's fetch pulls a
    # 912 MiB compressed image (2.53 GB unpacked) before the gate runs.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release pull requests stay blocked until roadmap milestone M13 is done
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: |
          state="$(python3 tools/roadmap_state.py M13)"
          if [ "$state" != "done" ]; then
            echo "::error::release pull request blocked: roadmap milestone M13" \
              "(release signing and remote delivery) is \"$state\", expected \"done\"."
            exit 1
          fi
          printf '%s\n' 'roadmap M13 is done; release pull requests may proceed.'

      - name: Check out pinned Praetor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cordanaLLM/praetor
          ref: ${{ env.PRAETOR_COMMIT }}
          path: praetor-src
          persist-credentials: false

      - name: Set up the Go toolchain declared by Praetor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: praetor-src/go.mod
          cache: false

      - name: Build pinned praetorctl from the published Praetor commit
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: |
          test "$(git -C praetor-src rev-parse HEAD)" = "$PRAETOR_COMMIT"
          mkdir -p "$RUNNER_TEMP/bin"
          ( cd praetor-src && go mod download && go mod verify \
            && go build -trimpath -buildvcs=false \
              -o "$RUNNER_TEMP/bin/praetorctl" ./cmd/standardsctl )
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # The Praetor checkout is a build input only; the preparation gate must
          # not scan or publish it as Aegis repository content.
          rm -rf praetor-src

      - name: Install pinned lefthook
        run: |
          url="https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/bin/lefthook" "$url"
          echo "${LEFTHOOK_SHA256}  $RUNNER_TEMP/bin/lefthook" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/lefthook"
          lefthook install

      # The runner image ships rustup and a Rust toolchain, but neither is the
      # pin: the image's toolchain is not named 1.98.1 and carries no clippy, so
      # a cargo gate run without this step would test whatever the image happens
      # to ship. `rustup toolchain install` with no toolchain argument installs
      # the active toolchain, which rust-toolchain.toml overrides to the pinned
      # channel, and -c materialises the components that same file names.
      - name: Materialise the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update --profile minimal \
            -c rustfmt,clippy
          rustup show active-toolchain
          rustup which rustc
          rustup which cargo-clippy

      # The accessibility gate inside make verify-all never pulls and never
      # downloads (M04). This is the one networked step: it pulls the
      # Playwright image by digest, downloads the pinned Node tarball and pnpm
      # binary, refuses either unless it hashes to its pin, and fills the
      # offline pnpm store, so the gate runs here instead of printing SKIP.
      # The runner has podman and docker; the gate prefers podman.
      - name: Fetch the accessibility gate's pinned inputs
        run: make a11y-fetch

      # The contract pair gate inside make verify-all never touches the network
      # either (M09, D93). This is its one networked step: git ls-remote against
      # both producers, a depth-1 fetch of cordanaLLM/imago at the commit
      # build/contract/producers.pin.json names, and a GOTOOLCHAIN=local build
      # with -buildvcs=true, refused unless the binary carries that revision. The
      # Go set up above for praetorctl builds it: Praetor's go.mod declares go
      # 1.27, which setup-go resolves to the newest 1.27 patch (1.27.1 when this
      # was written), at or above the go 1.27.1 imago's go.mod requires.
      - name: Fetch the contract pair's pinned producer
        run: make contract-fetch

      # make verify-all runs the crate gate itself once a workspace manifest is
      # present, so the cargo evidence sits inside this one job. That is
      # deliberate: the branch ruleset requires exactly the "Verification gate"
      # check, and a separate job would not be required and could be skipped.
      - name: Verification gate
        run: make verify-all

      - name: REUSE compliance
        run: pipx run "reuse==${REUSE_VERSION}" lint

      - name: Markdown lint
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_VERSION}"

      - name: YAML lint
        run: pipx run "yamllint==${YAMLLINT_VERSION}" .

      - name: Python lint
        run: |
          pipx run "flake8==${FLAKE8_VERSION}" .
          pipx run "black==${BLACK_VERSION}" --check --line-length 100 \
            tools .config/agent/hooks

      - name: Shell lint
        run: git ls-files '*.sh' | xargs -r shellcheck -x

      - name: DCO sign-off on pull request commits
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha lacks a Signed-off-by trailer"
              missing=1
            fi
          done
          exit "$missing"
