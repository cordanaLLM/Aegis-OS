---
# Documentation portal: builds the tracked documentation prose with MkDocs and
# publishes it to GitHub Pages, matching the self-description in mkdocs.yml. It
# is documentation only. It builds no image, kernel, or release artefact, and a
# green run is not evidence for any blocked gate.
name: Documentation portal

on:
  # Every pull request builds the portal, whatever it touches: Build
  # documentation is a required check, and a path filter would leave it
  # expected forever on a pull request that touches no documentation.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CONTEXT.md"
      - "GOVERNANCE.md"
      - "CONTRIBUTING.md"
      - "LICENSING.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default; the deploy job raises exactly what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # HISS-18: a draft stops here, before any work, and fails, so a
      # required check never reports a skipped draft as a pass. Marking the
      # pull request ready for review starts the run that replaces it.
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned documentation dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt

      - name: Build the portal with zero-warning strict mode
        run: python -m mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
