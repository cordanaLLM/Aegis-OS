# Documentation portal: builds the tracked planning and governance prose with
# MkDocs and publishes it to GitHub Pages. It is documentation only. It builds
# no image, kernel, or release artefact, and a green run is not evidence for
# the blocked build, boot, hardware, or release gates.
name: Documentation portal

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CONTEXT.md"
      - "GOVERNANCE.md"
      - "CONTRIBUTING.md"
      - "LICENSING.md"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CONTEXT.md"
      - "GOVERNANCE.md"
      - "CONTRIBUTING.md"
      - "LICENSING.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default; the deploy job raises exactly what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned documentation dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt

      - name: Build the portal with zero-warning strict mode
        run: python -m mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
