---
# Release train: keeps CHANGELOG.md and VERSION current inside an automatically
# maintained release pull request. It publishes nothing. Tagging and GitHub
# releases stay skipped until planning/roadmap.json records milestone M13
# (release signing and remote delivery) as done, and the Preparation gate
# refuses to pass on a release-please branch until the same condition holds.
#
# The job runs only when the repository variable RELEASE_TRAIN_ENABLED is
# "true". The organization currently forbids GitHub Actions from creating pull
# requests, which makes release-please fail after it has already pushed its
# branch. Enable the organization setting "Allow GitHub Actions to create and
# approve pull requests" first, then:
# gh api --method PATCH repos/cordanaLLM/Aegis-OS/actions/variables/RELEASE_TRAIN_ENABLED -f
#   name=RELEASE_TRAIN_ENABLED -f value=true
name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    if: vars.RELEASE_TRAIN_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Least privilege for this job only; the workflow default stays read.
      contents: write # push the release branch and, once unblocked, tag
      pull-requests: write # open and refresh the release pull request
      issues: write # "autorelease: pending"/"tagged" lifecycle labels
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the M13 release gate from planning/roadmap.json
        id: gate
        run: |
          state="$(python3 tools/roadmap_state.py M13)"
          if [ "$state" = "done" ]; then skip=false; else skip=true; fi
          printf 'roadmap M13 state=%s -> skip-github-release=%s\n' "$state" "$skip"
          printf 'skip-github-release=%s\n' "$skip" >> "$GITHUB_OUTPUT"

      - name: Maintain the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ steps.gate.outputs.skip-github-release }}

  disabled-notice:
    name: Release train disabled
    if: vars.RELEASE_TRAIN_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain why no release pull request is maintained
        run: |
          printf '%s\n' \
            'Release train disabled: RELEASE_TRAIN_ENABLED is not "true".' \
            'Enable Actions pull request creation for the organization,' \
            'then set the variable to true.' \
            'Releases stay blocked until roadmap M13 is done.'
