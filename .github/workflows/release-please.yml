---
# Release train: keeps CHANGELOG.md and VERSION current inside an automatically
# maintained release pull request. It publishes nothing. Tagging and GitHub
# releases stay skipped until planning/roadmap.json records milestone M13
# (release signing and remote delivery) as done, and the Verification gate
# refuses to pass on a release-please branch until the same condition holds.
#
# The job runs only when the repository variable RELEASE_TRAIN_ENABLED is
# "true". It acts through the plurano-release GitHub App, never through the
# workflow token: GitHub starts no workflow runs for a pull request that the
# workflow token opens or updates, so the release pull request would carry no
# verification. Without the app's client id (organization variable
# RELEASE_APP_CLIENT_ID) and key (organization secret RELEASE_APP_PRIVATE_KEY)
# the job stops at its first step and says so. To run the train:
# gh api --method PATCH repos/cordanaLLM/Aegis-OS/actions/variables/RELEASE_TRAIN_ENABLED -f
#   name=RELEASE_TRAIN_ENABLED -f value=true
name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    if: vars.RELEASE_TRAIN_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # The workflow token only checks out; release-please writes with the app
      # token, scoped below to what it needs.
      contents: read
    steps:
      - name: Require the release app credentials
        env:
          CLIENT_ID_SET: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
          PRIVATE_KEY_SET: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$CLIENT_ID_SET" != "true" ] || [ "$PRIVATE_KEY_SET" != "true" ]; then
            message="RELEASE_APP_CLIENT_ID (variable) and RELEASE_APP_PRIVATE_KEY (secret)"
            message="$message must both be set; release-please acts through the"
            message="$message plurano-release app, never the workflow token."
            echo "::error title=Missing release app credentials::$message" >&2
            exit 1
          fi

      - name: Create the release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # push the release branch and, once unblocked, tag
          permission-pull-requests: write # open and refresh the release pull request
          permission-issues: write # "autorelease: pending"/"tagged" lifecycle labels

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the M13 release gate from planning/roadmap.json
        id: gate
        run: |
          state="$(python3 tools/roadmap_state.py M13)"
          if [ "$state" = "done" ]; then skip=false; else skip=true; fi
          printf 'roadmap M13 state=%s -> skip-github-release=%s\n' "$state" "$skip"
          printf 'skip-github-release=%s\n' "$skip" >> "$GITHUB_OUTPUT"

      # One transient forge error (a GraphQL 5xx on 2026-10-18) must not leave
      # main's latest run red: the first attempt may fail, and the retry below
      # runs the same pin with the same inputs once after a pause; a failed
      # retry fails the run. tools/verify_preparation.py checks this shape.
      - name: Maintain the release pull request
        id: train
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with: &release-please-inputs
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ steps.gate.outputs.skip-github-release }}

      - name: Pause before the retry
        if: steps.train.outcome == 'failure'
        run: sleep 60

      - name: Retry the release pull request once
        if: steps.train.outcome == 'failure'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with: *release-please-inputs

  disabled-notice:
    name: Release train disabled
    if: vars.RELEASE_TRAIN_ENABLED != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Explain why no release pull request is maintained
        run: |
          printf '%s\n' \
            'Release train disabled: RELEASE_TRAIN_ENABLED is not "true".' \
            'With the release app credentials in place, set the variable' \
            'to true.' \
            'Releases stay blocked until roadmap M13 is done.'
