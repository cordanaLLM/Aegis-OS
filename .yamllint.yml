---
# YAML style for repository-owned files.
#
# Exceptions, each for a structural reason:
#   truthy check-keys: GitHub Actions requires the literal key `on:`, which the
#     default check reports as a truthy value.
#   line-length 100: pinned action digests (`uses: owner/repo@<40 hex> # vX.Y`)
#     and single-token values cannot be wrapped.
#   ignored paths: .config/archetypes/** is digest-pinned by .standards.lock and
#     must stay byte-identical; Praetor generates and rewrites the remaining
#     ignored files, so their style is an upstream concern. pnpm-lock.yaml is
#     written by pnpm and read back by `pnpm install --frozen-lockfile`, whose
#     integrity lines cannot be wrapped; a hand edit to fit this style would be
#     the lockfile drift the M04 gate refuses.
#   linted Praetor assets: praetorctl audit locks tools/markdownlint/ and
#     praetor-docs.yml byte for byte, and Praetor ships both clean under
#     yamllint's strict defaults since cordanaLLM/praetor#517, which the rules
#     here only relax. That change asks adopters to keep both out of their
#     yamllint config because a bot that rewrites them breaks the lock; yamllint
#     only reads, so linting them here cannot, and a later Praetor text that
#     fails lint shows up in the pin bump that carries it.
extends: default

rules:
  truthy:
    check-keys: false
  line-length:
    max: 100
  comments:
    min-spaces-from-content: 1

ignore: |
  .config/archetypes/
  .config/lefthook/
  .standards.yaml
  .standards.lock
  .config/labels.yaml
  .workingdir/
  .workingdir2/
  site/
  ui/concordia-tokens/pnpm-lock.yaml
