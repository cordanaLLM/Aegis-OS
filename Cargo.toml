[workspace]
resolver = "3"
members = [
    "crates/aegis-athena",
    "crates/aegis-calliope",
    "crates/aegis-compositor",
    "crates/aegis-concordia",
    "crates/aegis-fabrica-defs",
    "crates/aegis-forum-shell",
    "crates/aegis-forum-shell-gpui",
    "crates/aegis-hephaestus",
    "crates/aegis-hestia",
    "crates/aegis-janus-lifecycle",
    "crates/aegis-justitia",
    "crates/aegis-lictor",
    "crates/aegis-ludus",
    "crates/aegis-minerva",
    "crates/aegis-scaena",
    "crates/aegis-tellus",
    "crates/aegis-tellus-rapl",
    "crates/aegis-vesta",
    "crates/aegis-vesta-sandbox",
    "crates/aegis-vulcan",
    "crates/aegis-vulcan-gpu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "EUPL-1.2"
repository = "https://github.com/cordanaLLM/Aegis-OS"
authors = ["Lusoris <lusoris@proton.me>"]

[workspace.dependencies]
accesskit = { version = "0.25.1", default-features = false }
async-io = "2.6.0"
atspi = { version = "0.30.0", default-features = false, features = ["proxies"] }
base16ct = { version = "1.0.0", default-features = false }
cros-libva = { git = "https://github.com/chromeos/cros-libva", rev = "59384456ac2ae78c0c3e5515f41ef1efd9b802cf" }
futures-lite = "2.6.1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "322cd509dcccaee1f6bc44725d270598ae8171ad", default-features = false, features = ["wayland"] }
gpui_linux = { git = "https://github.com/zed-industries/zed", rev = "322cd509dcccaee1f6bc44725d270598ae8171ad", default-features = false, features = ["wayland"] }
rustix = { version = "1.1.5", features = ["net", "fs", "event"] }
saeptum-capsule = { git = "https://github.com/plurano/saeptum", rev = "997a1b34f0a2912de8bf67231846b3af512ff041" }
saeptum-microvm = { git = "https://github.com/plurano/saeptum", rev = "997a1b34f0a2912de8bf67231846b3af512ff041" }
schemars = { version = "1.2.2", default-features = false, features = ["derive"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
smithay-client-toolkit = { version = "0.21.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
tornus-geometry = { git = "https://github.com/plurano/tornus", rev = "df214e113701297d995cd3d14ffd877bd0cf8d27" }
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
