[workspace]
resolver = "3"
members = [
    "crates/aegis-athena",
    "crates/aegis-calliope",
    "crates/aegis-compositor",
    "crates/aegis-fabrica-defs",
    "crates/aegis-forum-shell",
    "crates/aegis-hephaestus",
    "crates/aegis-hestia",
    "crates/aegis-janus-lifecycle",
    "crates/aegis-justitia",
    "crates/aegis-lictor",
    "crates/aegis-ludus",
    "crates/aegis-minerva",
    "crates/aegis-scaena",
    "crates/aegis-tellus",
    "crates/aegis-tellus-rapl",
    "crates/aegis-vesta",
    "crates/aegis-vesta-sandbox",
    "crates/aegis-vulcan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "EUPL-1.2"
repository = "https://github.com/cordanaLLM/Aegis-OS"
authors = ["Lusoris <lusoris@proton.me>"]

[workspace.dependencies]
accesskit = { version = "0.25.1", default-features = false }
base16ct = { version = "1.0.0", default-features = false }
cros-libva = { git = "https://github.com/chromeos/cros-libva", rev = "59384456ac2ae78c0c3e5515f41ef1efd9b802cf" }
rustix = { version = "1.1.5", features = ["net", "fs", "event"] }
saeptum-capsule = { git = "https://github.com/plurano/saeptum", rev = "dd67f6e1f3703dd7d5c33fe1a09fcc88f4804b7b" }
saeptum-microvm = { git = "https://github.com/plurano/saeptum", rev = "dd67f6e1f3703dd7d5c33fe1a09fcc88f4804b7b" }
schemars = { version = "1.2.2", default-features = false, features = ["derive"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
smithay-client-toolkit = { version = "0.21.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
tornus-geometry = { git = "https://github.com/plurano/tornus", rev = "ad996c1f1a1598e82b48705be9bc7b15828fee6f" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
