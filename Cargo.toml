[workspace]
resolver = "3"
members = ["crates/aegis-fabrica-defs", "crates/aegis-justitia"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
repository = "https://github.com/cordanaLLM/Aegis-OS"
authors = ["Lusoris <lusoris@proton.me>"]

[workspace.dependencies]
base16ct = { version = "1.0.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
