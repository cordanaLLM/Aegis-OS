#
# P01 image definition. Reviewed from private source export-049,
# sha256 4d9043f4af305e2e0866587587d37b3f2195cc382a66fde2fc0e3ef7782a2144
# (REQ-P01-01 the Arch distribution and the UKI output, REQ-P01-06 the
# build/mkosi.conf path the imported workflow synthesises against, REQ-P01-09
# the linux-rt boot kernel, REQ-P02-06 systemd-ukify and systemd-repart).
#
# It is a definition, not a build: `mkosi summary` resolves configuration and
# prints it, no gate in this repository runs `mkosi build`, and nothing here
# produces an image, a UKI, a signature or boot evidence. Decision D56 keeps
# this validation in Aegis for as long as Imago is a scaffold.
#
# Every setting name below was read back from `mkosi documentation` on the
# admitted mkosi 27, not from memory. `tools/verify_mkosi_definitions.py`
# parses this file with the host's own mkosi and fails when the Output stanza
# of the main image does not appear or does not say what is recorded in
# docs/build/product-input.md.
#
# Changed from the source, each with its reason:
#
#   Release=latest -> Snapshot=2026/09/13 (decision D18). The imported value
#     resolves to whatever a mirror serves at build time, which REQ-P01-01
#     records as the reason the image inputs are not reproducible. mkosi 27
#     resolves a dated Arch snapshot against
#     https://archive.archlinux.org/repos/<snapshot>/$repo/os/$arch and formats
#     the identifier %Y/%m/%d; both were read from the installed version's own
#     source. No mirror was contacted to write this file, and whether the
#     pinned snapshot builds is M11 work.
#
#   Format=uki -> Format=disk, with Bootable=yes, Bootloader=uki and
#     SplitArtifacts=uki,kernel,initrd,roothash added. `uki` is one of the
#     OutputFormat values the installed mkosi 27 admits, so this is a choice
#     and not something the tool forced. A bare UKI is a single file with no
#     partition table, and RepartDirectories= and the M03 A/B partition set
#     have nothing to apply to in one; the P01 product is an A/B disk image, so
#     the image is the disk and the UKI is one of its artefacts. REQ-P01-01's
#     UKI is therefore not dropped: Bootloader=uki makes the unified image the
#     boot entry, and SplitArtifacts= emits it, the kernel, the initrd and the
#     verity root hash beside the image. Building either is M11 work; this file
#     declares the output, and no gate here runs `mkosi build`.
#
#   The hardcoded 1.0.0 in the output name is dropped. The M01 register records
#     it as a version no release process produces and assigns output naming to
#     M11, so ImageId= carries the identity and no ImageVersion= is set.
#
#   The content list is trimmed to the packages the recorded requirements name:
#     linux-rt (REQ-P01-09, the D07 default boot kernel), systemd (which ships
#     systemd-repart) and systemd-ukify (REQ-P02-06, its own package on this
#     distribution). A dated snapshot fixes every package version at once, so
#     the list carries names and no versions. The register's "remaining image
#     packages" row stays open for M11; guessing a content set no requirement
#     asks for is the unpinned inheritance this milestone removes.
#
#   MinimumVersion=27 is added. The import carried no version guard at all.
#     mkosi refuses a configuration that asks for a newer mkosi than the one
#     running it, answering `mkosi 28 or newer is required by this
#     configuration (found 27)` with exit 1, so the admitted floor is enforced
#     by the tool rather than by a version string a reader has to trust.
#
#   RepartDirectories=repart.d is added, so the image definition and the M03
#     partition definitions are the same set of files rather than two
#     descriptions that happen to agree. mkosi resolves it to build/repart.d,
#     which the gate reads back from the summary.
#
#   Seed= is fixed so two runs produce the same partition UUIDs, the same way
#     tools/verify_systemd_definitions.py pins its own seed.

[Config]
MinimumVersion=27

[Distribution]
Distribution=arch
Architecture=x86-64
Snapshot=2026/09/13

[Output]
Format=disk
ImageId=aegis-os
RepartDirectories=repart.d
SplitArtifacts=uki,kernel,initrd,roothash
Seed=1d8b8b28-0b1f-4c1a-9a5f-2a0c3e4d5f60

[Content]
Packages=linux-rt,systemd,systemd-ukify
Bootable=yes
Bootloader=uki
