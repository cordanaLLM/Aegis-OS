#
# P01/P02 EFI system partition. Reviewed from private source export-053,
# sha256 d85a1f6ceb0ed37ac9e25e6c576a58f034efbdce8bad3832336b0c6335e2deac
# (REQ-P01-10: the ESP is bounded between 512M and 1G).
#
# Changed from the source: the imported "Subsystem=block" line is dropped.
# systemd-repart 261 answers it with
#   00-esp.conf:4: Unknown key 'Subsystem' in section [Partition], ignoring.
# and still exits 0, so an ignored key is silent drift rather than a refusal.
# tools/verify_systemd_definitions.py therefore fails on that diagnostic
# (REQ-CI-01) and tests/systemd/repart-unknown-key/ keeps the case observable.
#
# Added after Imago run 39090040772: CopyFiles=/efi:/. With Bootloader=uki,
# mkosi 27.1 writes the UKI to /efi/EFI/BOOT/BOOTX64.EFI, and with /boot alone
# the ESP stayed empty and the firmware found no boot option. Both lines are
# the pair mkosi 27.1 writes into its own default 00-esp.conf.
# build/mkosi.postoutput.d/image_layout.py refuses an image without the UKI.

[Partition]
Type=esp
Format=vfat
Label=ESP
SizeMinBytes=512M
SizeMaxBytes=1G
CopyFiles=/boot:/
CopyFiles=/efi:/
Priority=100
