#
# P01/P02 root slot A: the immutable EROFS root with dm-verity data integrity.
# Reviewed from private source export-054,
# sha256 41d6d121b142e68d3daec8d2708962631a644bd1c31f268db6c59f351a43c8fa
# (REQ-P01-02 EROFS + dm-verity, REQ-P02-07 Verity=data).
#
# Unchanged from the source: every key it carries is accepted by
# systemd-repart 261. VerityMatchKey= pairs this data partition with the hash
# partition in 11-root-verity.conf; without that partner systemd-repart 261
# refuses the set with
#   10-root-a.conf:1: Missing verity hash partition for verity data partition
#   with VerityMatchKey=root.

[Partition]
Type=root
Format=erofs
Label=root-a
Verity=data
VerityMatchKey=root
Minimize=yes
Priority=90
Weight=1000
