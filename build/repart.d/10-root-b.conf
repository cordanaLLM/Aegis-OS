#
# P01/P02 root slot B: the empty alternate slot that systemd-sysupdate writes
# the next release into. No private source ships this file; it is required by
# the dual-slot transfer in export-063,
# sha256 b284bb77c19f33a6674357a28f26f183984ee59707bd8c9dfd572da4dbf768a2
# (REQ-P01-04, REQ-P02-04: the transfer target spans root-a and root-b).
#
# The slot carries no Format= and no Verity= on purpose: at image-build time it
# holds no filesystem, and the release written into it brings its own EROFS
# image and roothash. Weight= matches 10-root-a.conf so the two slots receive
# the same share of the disk; an asymmetric pair would accept a release into A
# that does not fit in B.
#
# Open point, not settled here: 10-root-a.conf carries Minimize=yes, so slot A
# is sized to its content while slot B is sized by weight. Whether the built
# image ships symmetric slots is M11 work over a real artefact.

[Partition]
Type=root
Label=root-b
Priority=90
Weight=1000
