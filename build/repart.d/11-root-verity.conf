#
# P01/P02 dm-verity hash partition for root slot A. No private source ships
# this file; it is required by the Verity=data declaration in 10-root-a.conf,
# which is reviewed from private source export-054,
# sha256 41d6d121b142e68d3daec8d2708962631a644bd1c31f268db6c59f351a43c8fa
# (REQ-P01-02, REQ-P02-07). systemd-repart 261 refuses a verity data partition
# whose VerityMatchKey= has no hash partner:
#   10-root-a.conf:1: Missing verity hash partition for verity data partition
#   with VerityMatchKey=root.
# The roothash the gate prints is the value REQ-P02-01 binds the boot chain to;
# signing it is M11/M20 work and is not claimed here.

[Partition]
Type=root-verity
Verity=hash
VerityMatchKey=root
Minimize=yes
Priority=90
