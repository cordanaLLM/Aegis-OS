#
# P01/P02 stateful /var: a TPM2-sealed encrypted Btrfs volume outside the
# read-only root image. Reviewed from private source export-055,
# sha256 c915f281532f2c48acdf1ff6d5e0343b6e5b3b95af6a9fae5a8b77edf2795f88
# (REQ-P01-03, REQ-P02-03).
#
# Changed from the source: the imported "BtrfsSubvolumes=" line is dropped.
# systemd-repart 261 answers it with
#   20-var.conf:8: Unknown key 'BtrfsSubvolumes' in section [Partition],
#   ignoring.
# and still exits 0, so keeping it would record a subvolume layout that the
# tool never creates. repart.d(5) on systemd 261 does define a Subvolumes= key,
# but it takes absolute paths inside the new file system, not the "@var
# @var-log @flatpak @containers @pglite" subvolume names the source used.
# Translating those five names into mount paths is a storage-layout decision,
# so REQ-P02-03's subvolume list stays an open point rather than being guessed
# into a supported key here.
#
# Encrypt=tpm2 is kept and is the reason the gate passes
# --defer-partitions=var: enrolment needs /dev/tpmrm0, which the unprivileged
# gate cannot open. See docs/build/definitions.md for the recorded exit code
# and diagnostic of the un-deferred run.

[Partition]
Type=var
Format=btrfs
Label=var
Encrypt=tpm2
SizeMinBytes=10G
Weight=2000
