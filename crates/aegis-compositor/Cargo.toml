[package]
name = "aegis-compositor"
description = "Aegis OS P04 validation slice: the bounded Wayland surface registry, the Tier-1 client table, a mocked Tier-2 mesh transport with immutable-read controls, the pinned frame-pacing constant, and the two edges P04 stands on. Pure Rust per ADR-0001; no wlroots, no compositor library, no GPU, no Wayland connection and no timing measurement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
aegis-calliope = { path = "../aegis-calliope" }
aegis-lictor = { path = "../aegis-lictor" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
