[package]
name = "aegis-lictor"
description = "Aegis OS P07 validation slice: the scx_cake four-tier EWMA burst classifier, the bounded resource-broker table and its focus arbitration, the locality mask, the fragility-probe state machine, and the two inbound edges P07 consumes. No eBPF, no aya, no cgroups, no D-Bus, no GPU and no timing measurement."
