[package]
name = "aegis-scaena"
description = "Aegis OS P17 Scaena first slice (M27): the D77 data plane for decoded video -- the aegis.p08-p17.decoded-frame.v1 descriptor and its line-delimited JSON-RPC 2.0 codec, one DMA-BUF fd per SOCK_SEQPACKET message over SCM_RIGHTS under send and receive deadlines, the checks before an attach, the layer-surface state machine and every Wayland wait under a deadline. VA-API through cros-libva, git-pinned (D80); the Wayland client through smithay-client-toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "aegis-scaena-display"
path = "src/bin/aegis-scaena-display.rs"

[dependencies]
cros-libva.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
smithay-client-toolkit.workspace = true
thiserror.workspace = true

[lints]
workspace = true
