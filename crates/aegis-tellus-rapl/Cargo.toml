[package]
name = "aegis-tellus-rapl"
description = "Aegis OS P13 measured-energy slice (M21): the counter readings make verify-workstation takes through one scoped sudo -n cat, turned into a rollover-safe energy delta, a Measured wattage behind aegis-tellus's M05 seam and an SCI rate from the unchanged engine; the unprivileged read, the dram and psys zones and an observed wrap are cases of the same run. Reads no file and starts no process: the gate reads, this binary computes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "aegis-tellus-rapl"
path = "src/bin/aegis-tellus-rapl.rs"

[dependencies]
aegis-tellus = { path = "../aegis-tellus" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
