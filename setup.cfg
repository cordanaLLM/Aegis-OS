# Python style for repository-owned scripts. Praetor generates and rewrites
# .config/lefthook/scripts/, so those files are excluded here and their style is
# an upstream concern, not a local edit.
[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = .config/lefthook/scripts, .workingdir, .workingdir2, site, .git
