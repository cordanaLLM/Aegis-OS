#
# Boundary fixture: SizeMinBytes= exactly equal to SizeMaxBytes=, at the lower
# end of REQ-P01-10's 512M..1G bound. systemd-repart 261 accepts it and exits 0;
# the partition is pinned to 512M with no growth.

[Partition]
Type=esp
Format=vfat
Label=ESP
SizeMinBytes=512M
SizeMaxBytes=512M
