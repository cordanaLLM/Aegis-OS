#
# Negative fixture: SizeMinBytes= greater than SizeMaxBytes=. systemd-repart
# 261 exits 1 with
#   00-esp.conf:1: SizeMinBytes= larger than SizeMaxBytes=, refusing.
# The pair inverts REQ-P01-10's 512M..1G bound on purpose.

[Partition]
Type=esp
Format=vfat
Label=ESP
SizeMinBytes=1G
SizeMaxBytes=512M
