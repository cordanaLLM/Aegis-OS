#
# Negative fixture: a key systemd-repart does not define. systemd-repart 261
# prints
#   00-esp.conf:14: Unknown key 'Subsystem' in section [Partition], ignoring.
# and still exits 0, which is why the gate fails on the diagnostic rather than
# on the exit code (REQ-CI-01). 'Subsystem=' is the key the imported ESP
# definition carried (private source export-053, sha256
# d85a1f6ceb0ed37ac9e25e6c576a58f034efbdce8bad3832336b0c6335e2deac).

[Partition]
Type=esp
Subsystem=block
Format=vfat
Label=ESP
SizeMinBytes=512M
SizeMaxBytes=1G
